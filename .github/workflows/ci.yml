name: Backend checks (manual)

# GitHub Actions is kept as a manual, optional check. The primary gate is
# `npm run verify` plus the versioned pre-push hook, so pushes never depend on
# GitHub billing or on hosted runners.
#
# Run it from the Actions tab with "Run workflow". The Redis job uses a service
# container and executes the live rate-limit integration check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Typecheck, tests, build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/homekeys_liberty?schema=public
      # CI-only value: 64 characters with 16 distinct characters. It never
      # protects real data; production uses its own secret.
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Run the test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  redis-limiter:
    name: Redis rate-limit integration
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: Back
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/homekeys_liberty?schema=public
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run the Redis rate-limit check
        run: npx tsx tests/live/redis-rate-limit-live.ts
