name: CI

# Continuous integration for HomeKeys Liberty.
#
# Runs on every pull request and every push to main, plus manual dispatch from
# the Actions tab.
#
# - frontend: typecheck, lint, tests and build for Front/. Also regenerates the
#   typed API client from Back/openapi.yaml and fails when the generated file
#   committed in the repository is out of sync with the contract.
# - backend: `npm run verify` (typecheck, tests, build, prisma validate,
#   audit). The test suite runs against the in-memory mock database, so no
#   database service is required.
# - redis-limiter: live rate-limit integration check using a Redis service
#   container.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Front
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run the test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Check generated API types are in sync with the OpenAPI contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Back
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/homekeys_liberty?schema=public
      # CI-only value: 64 characters with 16 distinct characters. It never
      # protects real data; production uses its own secret.
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, tests, build, prisma validate, audit)
        run: npm run verify

  redis-limiter:
    name: redis-limiter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend
    defaults:
      run:
        working-directory: Back
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/homekeys_liberty?schema=public
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: silent
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Back/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the Redis rate-limit check
        run: npx tsx tests/live/redis-rate-limit-live.ts
