openapi: 3.1.0
info:
  title: HomeKeys Liberty API
  version: 1.0.0
  description: |
    REST API for the HomeKeys Liberty real-estate platform.

    ## Authentication
    Protected endpoints require a Bearer JWT issued by `POST /api/v1/auth/login`.
    Tokens expire after one hour. Changing the password, resetting it, or
    deactivating the account invalidates previously issued tokens.

    ## Error format
    Every error uses the same JSON shape: `success: false`, a stable `code`, a
    Spanish user-facing `message`, and an optional `errors` array with field-level
    details for validation failures.

    ## Language
    Source identifiers are in English. User-facing messages are in Spanish.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, logout and password recovery.
  - name: Users
    description: User management. ADMIN-only except the current-user endpoints.
  - name: Audit
    description: Append-only security and business history.
  - name: Properties
    description: Property captures, internal ownership and photo management.
  - name: Health
    description: Public liveness and readiness probes.
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 when the process is running. It does not touch the database.
      security: []
      responses:
        "200":
          description: API is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Runs `SELECT 1` against PostgreSQL. Public and not rate limited.
      security: []
      responses:
        "200":
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated. Returns a JWT and the safe user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Correct password, but the account is deactivated (`ACCOUNT_INACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Email temporarily locked (`ACCOUNT_LOCKED`) or rate limit exceeded (`TOO_MANY_LOGIN_ATTEMPTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Close the current session
      description: Idempotent. A repeated or concurrent logout still returns 200.
      responses:
        "200":
          description: Session closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password recovery link
      description: |
        Always returns the same generic response, whether the email exists or
        not. Token issuance and SMTP delivery run in the background.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted. The response is intentionally generic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limit exceeded (`TOO_MANY_RESET_ATTEMPTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a password with a single-use token
      description: |
        Used by password recovery and by invitation activation. The token comes
        from the email link fragment (`#token=...`). Two concurrent requests
        cannot both consume the same token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset. Every previous session is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataResponse"
        "400":
          description: |
            Invalid body (`VALIDATION_ERROR`), unknown token
            (`INVALID_RESET_TOKEN`), expired token (`RESET_TOKEN_EXPIRED`) or
            already used token (`RESET_TOKEN_ALREADY_USED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_RESET_ATTEMPTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/add:
    post:
      tags: [Users]
      summary: Create a user
      description: |
        ADMIN only. The administrator never sets or knows the password. The API
        generates an internal credential, queues a single-use invitation link in
        the same transaction, and the user defines their own password when
        activating the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The email already belongs to another user (`EMAIL_ALREADY_REGISTERED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_ADMIN_ACTIONS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: ADMIN only. Paginated, searchable, filterable and sortable.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/UserSearch"
        - $ref: "#/components/parameters/UserRoleFilter"
        - $ref: "#/components/parameters/UserActiveFilter"
        - $ref: "#/components/parameters/UserSortBy"
        - $ref: "#/components/parameters/UserSortOrder"
      responses:
        "200":
          description: User page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the current user
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Users]
      summary: Update my profile
      description: |
        Any authenticated user can update its own names, phone and photo. Email,
        role, account status and password are not accepted here; they have
        dedicated ADMIN or password endpoints. Blocked while a mandatory
        password change is pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/me/password:
    patch:
      tags: [Users]
      summary: Change my password
      description: |
        Invalidates every previously issued session and returns a fresh token
        for the caller. A wrong current password returns 422 and keeps the
        session valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed. Use `data.token` for the current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The current password is wrong (`INVALID_CURRENT_PASSWORD`). The session remains valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_PASSWORD_CHANGE_ATTEMPTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get a user by ID
      description: ADMIN only. PARTNER users must use `/users/me`.
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      summary: Update a user
      description: |
        ADMIN only. Partial update; at least one field is required. Changing the
        email invalidates pending links and notifies the previous address.
        Deactivation blocks login and existing sessions; reactivation invalidates
        sessions issued before the deactivation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Duplicate email (`EMAIL_ALREADY_REGISTERED`), last active ADMIN
            (`LAST_ADMIN_REQUIRED`) or self-deactivation
            (`SELF_DEACTIVATION_NOT_ALLOWED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_ADMIN_ACTIONS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        ADMIN only. Physical deletion. Use `PATCH /users/{id}` with
        `isActive: false` to keep the history. A user with properties cannot be
        deleted.
      responses:
        "200":
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Self-deletion (`SELF_DELETION_NOT_ALLOWED`), last active ADMIN
            (`LAST_ADMIN_REQUIRED`) or user with properties
            (`USER_HAS_PROPERTIES`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_ADMIN_ACTIONS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/send-password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Send a password reset link
      description: |
        ADMIN only. Issues a single-use recovery link and sends it to the user's
        email. The administrator never sees or sets the password. Deactivated
        accounts are rejected; reactivate them first.
      responses:
        "200":
          description: Link issued and queued for durable delivery. `data.emailSent` is reported for compatibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is deactivated (`USER_INACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_ADMIN_ACTIONS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/resend-invitation:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Resend the activation invitation
      description: |
        ADMIN only. Reissues the 24-hour activation link for an account that is
        still pending activation (`mustChangePassword: true`). Any previously
        pending invitation or recovery link is replaced. Deactivated accounts
        are rejected; activated accounts must use the password reset link
        instead.
      responses:
        "200":
          description: Invitation issued and queued for durable delivery. `data.emailSent` is reported for compatibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The account is deactivated (`USER_INACTIVE`) or already activated
            (`INVITATION_NOT_PENDING`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`TOO_MANY_ADMIN_ACTIONS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit history
      description: |
        ADMIN sees every event. PARTNER sees only its own events; an `actorId`
        sent by a PARTNER is ignored. The history is append-only and has no
        edit or delete endpoints.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditScopeFilter"
        - $ref: "#/components/parameters/AuditActionFilter"
        - $ref: "#/components/parameters/AuditActorFilter"
        - $ref: "#/components/parameters/AuditEntityTypeFilter"
        - $ref: "#/components/parameters/AuditEntityIdFilter"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: Audit log page, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/property-photo-batches:
    post:
      tags: [Properties]
      summary: Create a temporary pre-creation photo batch
      description: |
        Photos must be uploaded and confirmed before the capture exists. A
        batch belongs to the authenticated user and expires after two hours.
      responses:
        "201":
          description: Empty open batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoBatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/property-photo-batches/{batchId}:
    parameters:
      - $ref: "#/components/parameters/PhotoBatchId"
    get:
      tags: [Properties]
      summary: Read an owned photo batch
      responses:
        "200":
          description: Batch with its READY photos in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign batch (`PHOTO_BATCH_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Expired (`PHOTO_BATCH_EXPIRED`) or consumed (`PHOTO_BATCH_NOT_OPEN`) batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/property-photo-batches/{batchId}/photos/upload-url:
    parameters:
      - $ref: "#/components/parameters/PhotoBatchId"
    post:
      tags: [Properties]
      summary: Create a pre-signed upload target inside a batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadTargetRequest"
      responses:
        "200":
          description: Short-lived upload target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadTargetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign batch (`PHOTO_BATCH_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Batch closed/expired or twenty-photo limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/property-photo-batches/{batchId}/photos/confirm:
    parameters:
      - $ref: "#/components/parameters/PhotoBatchId"
    post:
      tags: [Properties]
      summary: Validate and confirm a batch photo
      description: Decodes the real image, strips EXIF/GPS and stores WebP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBatchPhotoRequest"
      responses:
        "201":
          description: READY temporary photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadResponse"
        "400":
          description: Invalid upload key (`INVALID_PHOTO_UPLOAD_KEY`) or body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign batch (`PHOTO_BATCH_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Batch closed/expired or photo limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing upload, oversized file or invalid image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/property-photo-batches/{batchId}/photos/{uploadId}/content:
    parameters:
      - $ref: "#/components/parameters/PhotoBatchId"
      - $ref: "#/components/parameters/PhotoUploadId"
    get:
      tags: [Properties]
      summary: Preview an owned temporary photo
      responses:
        "200":
          description: WebP temporary photo bytes.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign batch/photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/property-photo-batches/{batchId}/photos/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/PhotoBatchId"
      - $ref: "#/components/parameters/PhotoUploadId"
    delete:
      tags: [Properties]
      summary: Remove a photo from an open batch
      responses:
        "200":
          description: Temporary photo deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBatchPhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign batch/photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Batch closed or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties:
    post:
      tags: [Properties]
      summary: Create a property capture
      description: |
        A PARTNER creates the capture for itself. An ADMIN creates for itself
        when `agentId` is omitted, or may assign any active ADMIN/PARTNER by
        providing `agentId`. The request must reference an owned photo batch
        with at least five READY photos; photos and capture are committed
        atomically. `code` and `currency` are generated by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
      responses:
        "201":
          description: Capture created as ACTIVE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A PARTNER tried to assign another agent (`PROPERTY_AGENT_ASSIGNMENT_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Selected user is inactive (`PROPERTY_AGENT_INACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            Selected agent does not exist (`INVALID_PROPERTY_AGENT`), fewer than
            five READY photos (`MINIMUM_PHOTOS_REQUIRED`) or a cover outside the
            batch (`INVALID_COVER_PHOTO`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Properties]
      summary: List accessible captures
      description: |
        PARTNER users only see their own captures. ADMIN users see all captures
        and may filter by `agentId`. Soft-deleted captures are always excluded.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: code
          in: query
          description: |
            Exact capture code. Accepts `1`, `0001`, `HK-1` or `HK-0001`; the
            server normalizes the value to the stored `HK-0001` format.
          schema:
            type: string
            minLength: 1
            maxLength: 22
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PropertyStatus"
        - name: propertyType
          in: query
          schema:
            $ref: "#/components/schemas/PropertyType"
        - name: listingType
          in: query
          schema:
            $ref: "#/components/schemas/ListingType"
        - name: state
          in: query
          schema:
            type: string
            maxLength: 100
        - name: city
          in: query
          schema:
            type: string
            maxLength: 100
        - name: neighborhood
          in: query
          schema:
            type: string
            maxLength: 100
        - name: priceMin
          in: query
          schema:
            type: number
            minimum: 0
        - name: priceMax
          in: query
          schema:
            type: number
            minimum: 0
        - name: bedroomsMin
          in: query
          schema:
            type: integer
            minimum: 0
        - name: bathroomsMin
          in: query
          schema:
            type: integer
            minimum: 0
        - name: parkingSpacesMin
          in: query
          schema:
            type: integer
            minimum: 0
        - name: agentId
          in: query
          description: ADMIN only.
          schema:
            type: integer
            minimum: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, price, title]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Capture page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: PARTNER tried to filter another agent (`PROPERTY_AGENT_FILTER_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Properties]
      summary: Get an accessible capture
      responses:
        "200":
          description: Capture with its ordered photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown, deleted or foreign capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Properties]
      summary: Update a capture
      description: |
        PARTNER edits only its own captures and cannot edit CLOSED captures.
        ADMIN may edit any capture, reassign the agent and reopen a CLOSED
        capture. Latitude and longitude must be supplied together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertyRequest"
      responses:
        "200":
          description: Updated capture.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden agent assignment (`PROPERTY_AGENT_ASSIGNMENT_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown or foreign capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Closed capture (`PROPERTY_CLOSED`) or inactive assignee (`PROPERTY_AGENT_INACTIVE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Selected agent does not exist (`INVALID_PROPERTY_AGENT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Properties]
      summary: Soft-delete a capture (ADMIN only)
      responses:
        "200":
          description: Capture hidden without deleting its audit history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePropertyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown or already deleted capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/upload-url:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      tags: [Properties]
      summary: Create a pre-signed photo upload target
      description: |
        Returns a short-lived PUT URL for R2 or a signed local endpoint during
        development. The declared MIME type and size are validated, but the
        actual bytes are verified during confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadTargetRequest"
      responses:
        "200":
          description: Upload target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadTargetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Closed capture (`PROPERTY_CLOSED`) or photo limit (`PHOTO_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/confirm:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    post:
      tags: [Properties]
      summary: Confirm a pre-signed photo upload
      description: |
        Validates the real image format, strips EXIF/GPS metadata, converts the
        photo to WebP, enforces the 20-photo limit and creates the photo row.
        The first photo becomes the cover.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPhotoRequest"
      responses:
        "201":
          description: Photo created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoResponse"
        "400":
          description: Invalid key or body (`INVALID_PHOTO_UPLOAD_KEY`, `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Closed capture (`PROPERTY_CLOSED`) or photo limit (`PHOTO_LIMIT_REACHED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing upload (`PHOTO_UPLOAD_NOT_FOUND`), oversized file (`PHOTO_TOO_LARGE`) or undecodable image (`INVALID_PHOTO_IMAGE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/order:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    patch:
      tags: [Properties]
      summary: Reorder all photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPhotosRequest"
      responses:
        "200":
          description: Photos in their new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoListResponse"
        "400":
          description: Incomplete/duplicate order (`PHOTO_ORDER_MISMATCH`, `VALIDATION_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown or foreign capture (`PROPERTY_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Closed capture (`PROPERTY_CLOSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/{photoId}/cover:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/PhotoId"
    patch:
      tags: [Properties]
      summary: Select the cover photo
      responses:
        "200":
          description: Selected cover photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown capture or photo (`PROPERTY_NOT_FOUND`, `PHOTO_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Closed capture (`PROPERTY_CLOSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/PhotoId"
    delete:
      tags: [Properties]
      summary: Delete a photo and its storage object
      description: |
        If the cover is deleted, the first remaining photo becomes the cover.
        A capture can never go below five photos.
      responses:
        "200":
          description: Photo deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePhotoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown capture or photo (`PROPERTY_NOT_FOUND`, `PHOTO_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Closed capture (`PROPERTY_CLOSED`) or the operation would leave
            fewer than five photos (`MINIMUM_PHOTOS_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/properties/{id}/photos/{photoId}/content:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
      - $ref: "#/components/parameters/PhotoId"
    get:
      tags: [Properties]
      summary: Download an accessible photo
      description: Authenticated content endpoint with capture ownership checks.
      responses:
        "200":
          description: WebP photo bytes.
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown capture or photo (`PROPERTY_NOT_FOUND`, `PHOTO_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/property-photos/local-upload:
    parameters:
      - name: X-Photo-Upload-Token
        in: header
        required: true
        description: HMAC-signed, short-lived local upload token.
        schema:
          type: string
          maxLength: 4096
    put:
      tags: [Properties]
      summary: Receive a local-development photo upload
      description: |
        Local-development replacement for an R2 pre-signed PUT. The signed
        token grants temporary upload permission; this endpoint is not used
        when `STORAGE_DRIVER=r2`.
      security: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Upload stored.
        "400":
          description: Content type or size mismatch (`PHOTO_UPLOAD_TYPE_MISMATCH`, `PHOTO_UPLOAD_SIZE_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired signed token (`PHOTO_UPLOAD_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Local uploads are disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Numeric user ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    PropertyId:
      name: id
      in: path
      required: true
      description: Numeric property capture ID.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    PhotoId:
      name: photoId
      in: path
      required: true
      description: Numeric photo ID scoped to the capture.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    PhotoBatchId:
      name: batchId
      in: path
      required: true
      description: Temporary photo batch UUID.
      schema:
        type: string
        format: uuid
    PhotoUploadId:
      name: uploadId
      in: path
      required: true
      description: Temporary photo upload UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size between 1 and 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserSearch:
      name: search
      in: query
      description: Case-insensitive match on first name, last name, email or phone.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    UserRoleFilter:
      name: role
      in: query
      schema:
        $ref: "#/components/schemas/Role"
    UserActiveFilter:
      name: isActive
      in: query
      description: Filter active or deactivated accounts.
      schema:
        type: string
        enum: ["true", "false"]
    UserSortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, firstName, lastName, email, role]
        default: createdAt
    UserSortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    AuditScopeFilter:
      name: scope
      in: query
      schema:
        $ref: "#/components/schemas/AuditScope"
    AuditActionFilter:
      name: action
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 80
    AuditActorFilter:
      name: actorId
      in: query
      schema:
        type: integer
        minimum: 1
    AuditEntityTypeFilter:
      name: entityType
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 40
    AuditEntityIdFilter:
      name: entityId
      in: query
      schema:
        type: integer
        minimum: 1
    AuditFrom:
      name: from
      in: query
      description: Inclusive lower bound for `createdAt`.
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Inclusive upper bound for `createdAt`.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Invalid body, path or query (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked token (`INVALID_SESSION`,
        `SESSION_REVOKED`, `SESSION_INVALIDATED`) or missing credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        Insufficient role (`ADMIN_REQUIRED`), mandatory password change
        (`PASSWORD_CHANGE_REQUIRED`) or deactivated account (`ACCOUNT_INACTIVE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist (`USER_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: The API is not ready because the database is unreachable (`NOT_READY`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Role:
      type: string
      enum: [ADMIN, PARTNER]
    AuditScope:
      type: string
      enum: [SECURITY, BUSINESS]
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - photoUrl
        - role
        - isActive
        - mustChangePassword
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          minimum: 1
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 20
        photoUrl:
          type: [string, "null"]
          format: uri
        role:
          $ref: "#/components/schemas/Role"
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 72
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
          description: At least 12 characters with uppercase, lowercase, number and special character.
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, phone]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^\+?[0-9\s().-]{6,20}$'
        photoUrl:
          type: [string, "null"]
          format: uri
        role:
          $ref: "#/components/schemas/Role"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^\+?[0-9\s().-]{6,20}$'
        photoUrl:
          type: [string, "null"]
          format: uri
        role:
          $ref: "#/components/schemas/Role"
        isActive:
          type: boolean
    UpdateOwnProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^\+?[0-9\s().-]{6,20}$'
        photoUrl:
          type: [string, "null"]
          format: uri
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
    AuditLog:
      type: object
      required:
        - id
        - scope
        - action
        - createdAt
      properties:
        id:
          type: integer
        scope:
          $ref: "#/components/schemas/AuditScope"
        actorId:
          type: [integer, "null"]
        actorRole:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        actorEmail:
          type: [string, "null"]
        action:
          type: string
          maxLength: 80
        entityType:
          type: [string, "null"]
        entityId:
          type: [integer, "null"]
        changes:
          type: [object, "null"]
          additionalProperties: true
        ip:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    PropertyType:
      type: string
      enum:
        - HOUSE
        - APARTMENT
        - TOWNHOUSE
        - LAND
        - COMMERCIAL
        - OFFICE
        - WAREHOUSE
        - FARM
    ListingType:
      type: string
      enum: [SALE, RENT]
    PropertyStatus:
      type: string
      enum: [ACTIVE, PAUSED, CLOSED]
    Currency:
      type: string
      enum: [USD]
    PropertyPhotoBatchStatus:
      type: string
      enum: [OPEN, CONSUMED, EXPIRED]
    PropertyPhotoUploadStatus:
      type: string
      enum: [READY, CONSUMED]
    PropertyPhotoUpload:
      type: object
      required:
        - id
        - previewUrl
        - mimeType
        - sizeBytes
        - width
        - height
        - altText
        - sortOrder
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        previewUrl:
          type: string
          format: uri-reference
        mimeType:
          type: string
          enum: [image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 8388608
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        altText:
          type: [string, "null"]
          maxLength: 300
        sortOrder:
          type: integer
          minimum: 0
        status:
          $ref: "#/components/schemas/PropertyPhotoUploadStatus"
        createdAt:
          type: string
          format: date-time
    PropertyPhotoBatch:
      type: object
      required:
        - id
        - status
        - expiresAt
        - createdAt
        - updatedAt
        - uploads
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/PropertyPhotoBatchStatus"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/PropertyPhotoUpload"
    PhotoBatchResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [batch]
              properties:
                batch:
                  $ref: "#/components/schemas/PropertyPhotoBatch"
    PhotoUploadResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [upload]
              properties:
                upload:
                  $ref: "#/components/schemas/PropertyPhotoUpload"
    ConfirmBatchPhotoRequest:
      type: object
      additionalProperties: false
      required: [storageKey]
      properties:
        storageKey:
          type: string
          maxLength: 500
          pattern: '^property-photo-batches/[0-9a-f-]{36}/uploads/[a-f0-9-]+\.(jpg|jpeg|png|webp)$'
        altText:
          type: [string, "null"]
          minLength: 1
          maxLength: 300
    DeleteBatchPhotoResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [deletedId]
              properties:
                deletedId:
                  type: string
